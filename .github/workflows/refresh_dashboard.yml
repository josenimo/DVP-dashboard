name: Refresh DVP Dashboard

on:
  schedule:
    # Run every Sunday at 00:00 UTC (every 7 days)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual execution via the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant push permissions to checkout action
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run Scraping Pipeline
        run: uv run main.py

      - name: Run Network Plot Validation
        run: uv run plot_network.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there are actual changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Auto-refresh DVP databases and dashboard [skip ci]"
            git push origin main
          else
            echo "No database changes detected."
          fi
